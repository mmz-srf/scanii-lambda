name: SRF Deployment
on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'Stage'
        required: true
        type: choice
        options:
          - dev
          - int
          - prd
jobs:
  build_and_deploy:
    name: Build and Deploy ${{ inputs.stage }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.stage }}
    env:
      STAGE: ${{ inputs.stage }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: build
        run: |
          npm install .
          mkdir -v build
          zip -9vr build/scanii-lambda.zip lib/ node_modules/ package* README.md LICENSE
      - name: configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ vars.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: deploy
        run: |
          case "$STAGE" in
            dev) RESOURCE_STAGE=test ;;
            int) RESOURCE_STAGE=stage ;;
            prd) RESOURCE_STAGE=production ;;
            *) echo "Unbekannte Stage: $STAGE" >&2; exit 1 ;;
          esac

          BUCKET="srf-deployment-s3-${RESOURCE_STAGE}"
          KEY="formio-scanii/latest.zip"

          aws s3 cp build/scanii-lambda.zip "s3://${BUCKET}/${KEY}"

          aws lambda update-function-code --function-name "formio-scanii-submit-${RESOURCE_STAGE}" --s3-bucket "${BUCKET}" --s3-key "${KEY}"
          aws lambda update-function-code --function-name "formio-scanii-callback-${RESOURCE_STAGE}" --s3-bucket "${BUCKET}" --s3-key "${KEY}"
